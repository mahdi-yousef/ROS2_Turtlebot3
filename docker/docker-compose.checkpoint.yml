# Alternate compose file for running from a locally committed checkpoint
# image instead of the base image -- see docs/DOCKER_CHECKPOINTING.md.
#
# Usage:
#   docker commit turtlebot3 tb3-checkpoint:working
#   docker compose -f docker-compose.checkpoint.yml up -d
#
# Note: shares container_name "turtlebot3" with docker-compose.yml -- only
# run one of the two compose files at a time.

services:
  turtlebot3:
    container_name: turtlebot3
    image: tb3-checkpoint:working
    tty: true
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    network_mode: host
    ipc: host
    pid: host
    environment:
     - DISPLAY=${DISPLAY}
     - QT_X11_NO_MITSHM=1
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /run/udev:/run/udev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ~/tb3_extra/turtlebot3_simulations:/root/turtlebot3_ws/src/turtlebot3_simulations
      - ../src/custom_packages:/root/turtlebot3_ws/src/custom_packages
    privileged: true
    command: bash
